[project]
name = "malaria-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sohom Mac", email = "chakmasohom@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "pillow>=13.0.0",
    "python-multipart>=0.0.34",
    "ultralytics==8.4.211",
    "uvicorn>=0.54.0",
]

[project.scripts]
malaria-api = "malaria_api:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"
